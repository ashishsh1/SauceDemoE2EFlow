name: Playwright Tests

# Run the workflow when code is pushed or a pull request is created.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Define the CI job.
jobs:

  test:

    # Use the latest Ubuntu runner provided by GitHub.
    runs-on: ubuntu-latest

    steps:

      # Download the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install project dependencies.
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers and required system dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Execute Playwright tests.
      - name: Run Playwright tests
        run: npm test
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      # Upload the Playwright HTML report.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Upload failure artifacts such as screenshots, traces and videos.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          
      - name: Upload generated order PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-summary-pdf
          path: generated/order-summary.pdf
          retention-days: 7